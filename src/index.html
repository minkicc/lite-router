<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Lite Router</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <header class="app-header">
      <div class="header-row">
        <nav class="tabs">
          <button class="tab active" data-tab="channels" data-i18n="tabs.channels">渠道</button>
          <button class="tab" data-tab="connect" data-i18n="tabs.connect">接入</button>
          <button class="tab" data-tab="usage" data-i18n="tabs.usage">使用记录</button>
        </nav>
        <div class="header-actions">
          <select id="locale-select" class="locale-select" aria-label="语言" data-i18n-aria-label="language.label">
            <option value="zh-CN">中文</option>
            <option value="en-US">English</option>
          </select>
          <div class="router-control">
            <label class="switch router-switch">
              <input type="checkbox" id="router-toggle" aria-label="启动或停止代理" data-i18n-aria-label="router.toggle" />
              <span class="track"></span>
            </label>
            <span id="process-state" class="router-state" data-i18n="router.checking">检测中…</span>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div class="main-content">
      <section id="connect" class="panel">
        <div class="connect-card connect-overview">
          <div class="endpoint-section">
            <div class="endpoint-label">Base URL</div>
            <div class="endpoint-value">
              <code id="base-url">http://127.0.0.1:8787/v1</code>
              <button class="ghost copy-button" data-copy="base-url" data-i18n="actions.copy">复制</button>
            </div>
          </div>
          <div class="setting-row">
            <div class="setting-name" data-i18n="connect.allowLan">局域网访问</div>
            <label class="switch">
              <input type="checkbox" id="allow-lan-toggle" />
              <span class="track"></span>
            </label>
          </div>

          <div class="setting-row">
            <div class="setting-name" data-i18n="connect.noToken">无需 Token</div>
            <label class="switch">
              <input type="checkbox" id="no-auth-toggle" />
              <span class="track"></span>
            </label>
          </div>

          <div id="lan-block" class="lan-block" hidden>
            <div class="section-label" data-i18n="connect.lanUrls">局域网接入地址</div>
            <div id="lan-urls" class="lan-urls"></div>
          </div>
        </div>

        <div id="token-module" class="connect-card token-card">
          <div class="card-toolbar">
            <button id="btn-add-token" class="primary" data-i18n="tokens.generate">生成 Token</button>
          </div>
          <div class="table-wrap flush-table">
            <table>
              <thead>
                <tr>
                  <th data-i18n="columns.name">名称</th>
                  <th>Token</th>
                  <th data-i18n="columns.status">状态</th>
                  <th data-i18n="columns.requests">请求数</th>
                  <th>Prompt</th>
                  <th>Completion</th>
                  <th data-i18n="columns.lastUsed">最近使用</th>
                  <th data-i18n="columns.actions">操作</th>
                </tr>
              </thead>
              <tbody id="token-rows"></tbody>
            </table>
          </div>
        </div>

        <div class="card workspace-card mapping-card">
          <div class="card-toolbar">
            <button id="btn-add-mapping" class="primary" data-i18n="mappings.add">添加模型映射</button>
          </div>
          <div class="table-wrap flush-table">
            <table>
              <thead>
                <tr>
                  <th data-i18n="columns.platformModel">平台模型</th>
                  <th data-i18n="columns.upstreamModel">上游模型</th>
                  <th data-i18n="columns.channel">渠道</th>
                  <th data-i18n="columns.enabled">启用</th>
                  <th data-i18n="columns.actions">操作</th>
                </tr>
              </thead>
              <tbody id="mapping-rows"></tbody>
            </table>
            <p id="mapping-empty" class="empty" data-i18n="mappings.empty">还没有模型映射。</p>
          </div>
        </div>
      </section>

      <section id="channels" class="panel active">
        <div class="card">
          <div class="card-title-row">
            <span class="card-title" data-i18n="groups.title">分组</span>
          </div>
          <div class="group-list" id="group-list"></div>
          <div class="group-add">
            <input id="group-input" placeholder="新分组名称" data-i18n-placeholder="groups.namePlaceholder" />
            <input id="group-priority-input" type="number" placeholder="优先级" data-i18n-placeholder="columns.priority" value="0" />
            <button id="btn-add-group" class="primary" data-i18n="groups.add">添加分组</button>
          </div>
        </div>

        <div class="card">
          <div class="toolbar">
            <button id="btn-add-channel" class="primary" data-i18n="channels.add">添加渠道</button>
            <button id="btn-check" class="ghost" data-i18n="channels.check">立即体检</button>
            <span class="muted" id="last-updated"></span>
          </div>
          <div id="channel-groups"></div>
          <p id="channel-empty" class="empty" data-i18n="channels.empty">还没有渠道，点击「添加渠道」开始。</p>
        </div>
      </section>

      <section id="usage" class="panel">
        <div class="card">
          <div class="usage-stats" id="usage-summary"></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th data-i18n="columns.time">时间</th>
                  <th data-i18n="columns.model">模型</th>
                  <th data-i18n="columns.channel">渠道</th>
                  <th>Token</th>
                  <th>Prompt</th>
                  <th>Completion</th>
                  <th data-i18n="columns.duration">耗时</th>
                  <th data-i18n="columns.status">状态</th>
                </tr>
              </thead>
              <tbody id="usage-rows"></tbody>
            </table>
          </div>
          <p id="usage-empty" class="empty" data-i18n="usage.empty">还没有使用记录，启动代理并调用后这里会显示。</p>
        </div>
      </section>
      </div>
    </main>

    <div id="modal" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-head">
          <span id="modal-title"></span>
          <button id="modal-close" class="icon-btn" aria-label="关闭" data-i18n-aria-label="actions.close">×</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
        <div class="modal-actions">
          <button id="modal-cancel" data-i18n="actions.cancel">取消</button>
          <button id="modal-save" class="primary" data-i18n="actions.save">保存</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status"></div>
  </body>
</html>
